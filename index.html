<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>神隱旅人圖鑑｜2026 年世界各國入境數量地圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg-cream: #fbf2e1;
      --bg-warm: #f1dec2;
      --ink-brown: #3e2517;
      --ink-soft: #6d462e;
      --wood-dark: #5c331c;
      --wood-mid: #8b5431;
      --wood-light: #d7b289;
      --vermilion: #c84b31;
      --vermilion-glow: #ee6c4d;
      --gold-leaf: #e9b44c;
      --paper: #fffaf0;

      /* 棕色漸層色階（入境數量越多越深） */
      --tier-6: #4a230d; /* 60,000,000+ */
      --tier-5: #7a421d; /* 30,000,000 - 59,999,999 */
      --tier-4: #a36636; /* 15,000,000 - 29,999,999 */
      --tier-3: #c89462; /* 5,000,000 - 14,999,999 */
      --tier-2: #e3c19d; /* 1,000,000 - 4,999,999 */
      --tier-1: #f5e6d3; /* < 1,000,000 */
      --tier-0: #faf3e8; /* 暫無資料 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink-brown);
      background: radial-gradient(circle at 50% 42%, #fff8ec 0%, #f5e5cc 58%, #e8cda7 100%);
      user-select: none;
    }

    /* 手繪和紙質感疊層 */
    .paper-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.32;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.38'/%3E%3C/svg%3E");
    }

    /* 漂浮靈火 / 金平糖微光粒子 */
    .spirit-motes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .mote {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 240, 185, 0.95) 0%, rgba(233, 180, 76, 0.4) 55%, rgba(233, 180, 76, 0) 100%);
      animation: floatMote linear infinite;
    }

    @keyframes floatMote {
      0% { transform: translateY(15px) translateX(0px) scale(0.85); opacity: 0; }
      25% { opacity: 0.75; }
      75% { opacity: 0.65; }
      100% { transform: translateY(-90px) translateX(18px) scale(1.15); opacity: 0; }
    }

    /* 油屋和風屋簷紅線裝飾 */
    .top-eave-border {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      z-index: 30;
      background: repeating-linear-gradient(
        90deg,
        var(--vermilion) 0px,
        var(--vermilion) 36px,
        var(--wood-dark) 36px,
        var(--wood-dark) 40px,
        var(--gold-leaf) 40px,
        var(--gold-leaf) 44px,
        var(--wood-dark) 44px,
        var(--wood-dark) 48px
      );
      box-shadow: 0 3px 10px rgba(74, 35, 13, 0.25);
    }

    /* 左右搖曳紙燈籠 */
    .lantern-wrap {
      position: fixed;
      top: 4px;
      z-index: 28;
      pointer-events: none;
      transform-origin: top center;
      animation: swayLantern 4.8s ease-in-out infinite;
    }

    .lantern-left { left: 22px; }
    .lantern-right { right: 22px; animation-delay: -2.1s; }

    @keyframes swayLantern {
      0%, 100% { transform: rotate(-3.2deg); }
      50% { transform: rotate(3.2deg); }
    }

    /* 頂部木札標題牌 */
    .title-plaque {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 26px 11px;
      background: linear-gradient(180deg, #fff9ee 0%, #f5e2c4 100%);
      border: 3px solid var(--wood-dark);
      border-radius: 18px;
      box-shadow:
        0 6px 0 var(--wood-dark),
        0 12px 26px rgba(74, 35, 13, 0.22),
        inset 0 0 0 2px rgba(233, 180, 76, 0.55);
    }

    .title-seal {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--vermilion);
      color: #fff8ec;
      border: 2px solid #8a2c17;
      border-radius: 10px;
      font-family: "Noto Serif TC", serif;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 1px;
      box-shadow: inset 0 0 0 2px rgba(255, 240, 215, 0.35);
      transform: rotate(-4deg);
    }

    .title-text h1 {
      font-family: "Noto Serif TC", "Zen Maru Gothic", serif;
      font-size: clamp(16px, 2.1vw, 22px);
      font-weight: 800;
      color: var(--ink-brown);
      letter-spacing: 0.06em;
      line-height: 1.25;
      white-space: nowrap;
    }

    .title-text p {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-soft);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* 主地圖容器 */
    #map-container {
      position: fixed;
      inset: 0;
      z-index: 5;
      cursor: grab;
    }

    #map-container:active {
      cursor: grabbing;
    }

    svg#world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .sphere-ocean {
      fill: url(#oceanGradient);
      stroke: #9b704a;
      stroke-width: 1.8;
      filter: drop-shadow(0 12px 28px rgba(92, 51, 28, 0.16));
    }

    .graticule {
      fill: none;
      stroke: rgba(139, 84, 49, 0.15);
      stroke-width: 0.65;
      stroke-dasharray: 3 3;
    }

    .country {
      stroke: #6e4529;
      stroke-width: 0.65;
      stroke-linejoin: round;
      stroke-linecap: round;
      transition: fill 0.22s ease, opacity 0.22s ease, stroke 0.18s ease;
      cursor: pointer;
    }

    .country:hover,
    .country.is-hovered {
      stroke: var(--vermilion);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 7px rgba(233, 180, 76, 0.85));
    }

    .country.dimmed {
      opacity: 0.3;
    }

    /* 漂浮雲朵動畫 */
    .cloud-drift-slow {
      animation: cloudDrift 34s ease-in-out infinite alternate;
      opacity: 0.55;
      pointer-events: none;
    }

    .cloud-drift-slower {
      animation: cloudDriftReverse 44s ease-in-out infinite alternate;
      opacity: 0.45;
      pointer-events: none;
    }

    @keyframes cloudDrift {
      0% { transform: translateX(-18px); }
      100% { transform: translateX(22px); }
    }

    @keyframes cloudDriftReverse {
      0% { transform: translateX(18px); }
      100% { transform: translateX(-20px); }
    }

    /* 可愛湯屋風格 Tooltip */
    #tooltip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.16s ease, transform 0.16s ease;
      min-width: 215px;
      max-width: 290px;
      padding: 12px 15px 13px;
      background: linear-gradient(180deg, #fffdf8 0%, #f9ead2 100%);
      border: 2.5px solid var(--wood-dark);
      border-radius: 16px;
      box-shadow:
        0 5px 0 var(--wood-dark),
        0 12px 24px rgba(62, 37, 23, 0.28);
    }

    #tooltip.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .tooltip-header {
      display: flex;
      align-items: center;
      gap: 9px;
      padding-bottom: 7px;
      border-bottom: 1.5px dashed rgba(139, 84, 49, 0.35);
    }

    .tooltip-swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--wood-dark);
      flex-shrink: 0;
    }

    .tooltip-country {
      font-family: "Noto Serif TC", "Zen Maru Gothic", serif;
      font-size: 17px;
      font-weight: 800;
      color: var(--ink-brown);
      line-height: 1.2;
    }

    .tooltip-body {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .tooltip-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--vermilion);
      letter-spacing: 0.05em;
    }

    .tooltip-value {
      font-size: 19px;
      font-weight: 900;
      color: var(--wood-dark);
      letter-spacing: 0.02em;
    }

    .tooltip-sub {
      font-size: 11px;
      color: var(--ink-soft);
      margin-top: 1px;
    }

    /* 右下角木牌圖例 */
    .legend-card {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      width: 258px;
      padding: 15px 16px 14px;
      background: linear-gradient(180deg, #fffaf0 0%, #f4dfc0 100%);
      border: 3px solid var(--wood-dark);
      border-radius: 18px;
      box-shadow:
        0 6px 0 var(--wood-dark),
        0 14px 28px rgba(62, 37, 23, 0.25),
        inset 0 0 0 2px rgba(233, 180, 76, 0.45);
    }

    /* 小煤炭球坐在圖例右上角 */
    .soot-mascot {
      position: absolute;
      top: -33px;
      right: 14px;
      width: 68px;
      height: 44px;
      pointer-events: none;
      animation: sootBounce 3.2s ease-in-out infinite;
    }

    @keyframes sootBounce {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    .legend-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: "Noto Serif TC", "Zen Maru Gothic", serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--ink-brown);
      margin-bottom: 10px;
      padding-bottom: 7px;
      border-bottom: 1.5px dashed rgba(139, 84, 49, 0.4);
    }

    .legend-title-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--vermilion);
      color: #fff8ec;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 7px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.15s ease;
    }

    .legend-item:hover {
      background: rgba(200, 75, 49, 0.11);
      transform: translateX(3px);
    }

    .legend-swatch {
      width: 20px;
      height: 15px;
      border-radius: 5px;
      border: 1.8px solid var(--wood-dark);
      flex-shrink: 0;
      box-shadow: 0 1px 0 rgba(62, 37, 23, 0.25);
    }

    .legend-range {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-brown);
      letter-spacing: 0.01em;
    }

    .legend-hint {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(139, 84, 49, 0.2);
      font-size: 10.5px;
      color: var(--ink-soft);
      text-align: center;
    }

    /* 左下角縮放控制木鈕 & 資料備註 */
    .bottom-left-panel {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .zoom-controls {
      display: flex;
      gap: 7px;
      padding: 6px;
      background: linear-gradient(180deg, #fffaf0 0%, #f4dfc0 100%);
      border: 2.5px solid var(--wood-dark);
      border-radius: 14px;
      box-shadow: 0 4px 0 var(--wood-dark), 0 8px 18px rgba(62, 37, 23, 0.2);
    }

    .zoom-btn {
      width: 34px;
      height: 34px;
      border: 2px solid var(--wood-dark);
      border-radius: 9px;
      background: #fff7e6;
      color: var(--ink-brown);
      font-family: inherit;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.14s ease;
    }

    .zoom-btn:hover {
      background: var(--vermilion);
      color: #fff8ec;
      transform: translateY(-1px);
    }

    .zoom-btn:active {
      transform: translateY(1px);
    }

    .source-note {
      padding: 6px 11px;
      background: rgba(255, 250, 240, 0.86);
      border: 1.5px solid rgba(92, 51, 28, 0.45);
      border-radius: 10px;
      font-size: 11px;
      color: var(--ink-soft);
      backdrop-filter: blur(4px);
    }

    /* 載入提示 */
    #loading-banner {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(251, 242, 225, 0.94);
      color: var(--ink-brown);
      font-size: 16px;
      font-weight: 700;
      transition: opacity 0.4s ease;
    }

    #loading-banner.hidden {
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .lantern-wrap { display: none; }
      .title-plaque {
        top: 14px;
        width: calc(100% - 28px);
        padding: 8px 14px;
      }
      .title-text p { font-size: 11px; }
      .legend-card {
        right: 12px;
        bottom: 12px;
        width: 215px;
        padding: 11px 12px;
      }
      .legend-range { font-size: 11px; }
      .bottom-left-panel {
        left: 12px;
        bottom: 12px;
      }
      .source-note { display: none; }
    }
  </style>
</head>
<body>
  <div class="paper-grain"></div>
  <div class="spirit-motes" id="spirit-motes"></div>
  <div class="top-eave-border"></div>

  <!-- 左側和風紅燈籠 -->
  <div class="lantern-wrap lantern-left" aria-hidden="true">
    <svg width="58" height="108" viewBox="0 0 58 108">
      <line x1="29" y1="0" x2="29" y2="16" stroke="#3e2517" stroke-width="2.5" />
      <rect x="19" y="15" width="20" height="6" rx="2" fill="#3e2517" />
      <ellipse cx="29" cy="48" rx="22" ry="29" fill="url(#lanternGlow)" stroke="#3e2517" stroke-width="2.4" />
      <path d="M9 36 Q29 41 49 36" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <path d="M7 48 Q29 53 51 48" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <path d="M9 60 Q29 65 49 60" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <text x="29" y="54" text-anchor="middle" fill="#fff8dc" font-family="Noto Serif TC, serif" font-weight="800" font-size="18">湯</text>
      <rect x="20" y="75" width="18" height="6" rx="2" fill="#3e2517" />
      <path d="M25 81 L23 102 M29 81 L29 105 M33 81 L35 102" stroke="#c84b31" stroke-width="2.2" stroke-linecap="round" />
      <defs>
        <radialGradient id="lanternGlow" cx="50%" cy="45%" r="55%">
          <stop offset="0%" stop-color="#ffd166" />
          <stop offset="55%" stop-color="#ee6c4d" />
          <stop offset="100%" stop-color="#b83b24" />
        </radialGradient>
      </defs>
    </svg>
  </div>

  <!-- 右側和風紅燈籠 -->
  <div class="lantern-wrap lantern-right" aria-hidden="true">
    <svg width="58" height="108" viewBox="0 0 58 108">
      <line x1="29" y1="0" x2="29" y2="16" stroke="#3e2517" stroke-width="2.5" />
      <rect x="19" y="15" width="20" height="6" rx="2" fill="#3e2517" />
      <ellipse cx="29" cy="48" rx="22" ry="29" fill="url(#lanternGlow)" stroke="#3e2517" stroke-width="2.4" />
      <path d="M9 36 Q29 41 49 36" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <path d="M7 48 Q29 53 51 48" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <path d="M9 60 Q29 65 49 60" fill="none" stroke="#8a2c17" stroke-width="1.4" opacity="0.65" />
      <text x="29" y="54" text-anchor="middle" fill="#fff8dc" font-family="Noto Serif TC, serif" font-weight="800" font-size="18">旅</text>
      <rect x="20" y="75" width="18" height="6" rx="2" fill="#3e2517" />
      <path d="M25 81 L23 102 M29 81 L29 105 M33 81 L35 102" stroke="#c84b31" stroke-width="2.2" stroke-linecap="round" />
    </svg>
  </div>

  <!-- 頂部油屋木札標題 -->
  <header class="title-plaque">
    <div class="title-seal">二六</div>
    <div class="title-text">
      <h1>神隱旅人圖鑑・2026 年世界各國入境數量地圖</h1>
      <p>棕色愈深表示入境旅客愈多・滑鼠移至各國即可查看名稱與人數（單位：位）</p>
    </div>
  </header>

  <!-- 載入遮罩 -->
  <div id="loading-banner">
    <svg width="56" height="56" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="18" fill="#2c1d16" />
      <path d="M32 10 L35 16 L41 12 L40 19 L47 17 L44 24 L52 25 L46 31 L53 35 L46 39 L49 46 L42 46 L42 53 L35 49 L32 55 L28 49 L21 53 L22 46 L14 46 L18 39 L11 35 L18 31 L12 25 L20 24 L17 17 L24 19 L23 12 L29 16 Z" fill="#2c1d16" />
      <circle cx="26" cy="30" r="5" fill="#fffdf8" />
      <circle cx="38" cy="30" r="5" fill="#fffdf8" />
      <circle cx="27" cy="30" r="2.2" fill="#1d110c" />
      <circle cx="37" cy="30" r="2.2" fill="#1d110c" />
    </svg>
    <span>正在繪製神隱世界航路與各國地圖中…</span>
  </div>

  <!-- 世界地圖 -->
  <div id="map-container">
    <svg id="world-map">
      <defs>
        <radialGradient id="oceanGradient" cx="50%" cy="46%" r="62%">
          <stop offset="0%" stop-color="#fdf6e9" />
          <stop offset="68%" stop-color="#f3e2c6" />
          <stop offset="100%" stop-color="#e4c89e" />
        </radialGradient>
      </defs>
      <g id="map-viewport"></g>
    </svg>
  </div>

  <!-- 滑鼠懸停提示卡 -->
  <div id="tooltip" role="status" aria-live="polite">
    <div class="tooltip-header">
      <span class="tooltip-swatch" id="tooltip-swatch"></span>
      <span class="tooltip-country" id="tooltip-country">國家名稱</span>
    </div>
    <div class="tooltip-body">
      <span class="tooltip-label">2026 年入境旅客數量</span>
      <span class="tooltip-value" id="tooltip-value">0 位</span>
      <span class="tooltip-sub" id="tooltip-sub"></span>
    </div>
  </div>

  <!-- 左下角縮放按鈕與說明 -->
  <div class="bottom-left-panel">
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoom-in" title="放大地圖" aria-label="放大地圖">＋</button>
      <button class="zoom-btn" id="zoom-out" title="縮小地圖" aria-label="縮小地圖">－</button>
      <button class="zoom-btn" id="zoom-reset" title="重置視角" aria-label="重置視角">⟲</button>
    </div>
    <div class="source-note">
      註：2026 年國際入境旅客推估值（依 UN Tourism 及各國觀光統計趨勢編製）
    </div>
  </div>

  <!-- 右下角圖例卡（含可愛小煤炭與金平糖） -->
  <aside class="legend-card" aria-label="入境數量顏色圖例">
    <svg class="soot-mascot" viewBox="0 0 80 52" aria-hidden="true">
      <!-- 小煤炭本體 -->
      <path d="M40 9 L43 14 L49 11 L48 17 L54 16 L51 22 L57 24 L52 29 L57 34 L51 37 L53 43 L46 42 L45 47 L40 43 L35 47 L34 42 L27 43 L29 37 L23 34 L28 29 L23 24 L29 22 L26 16 L32 17 L31 11 L37 14 Z" fill="#2b1c15" />
      <circle cx="35" cy="27" r="4.5" fill="#fffdf8" />
      <circle cx="45" cy="27" r="4.5" fill="#fffdf8" />
      <circle cx="36" cy="27" r="2" fill="#180e0a" />
      <circle cx="44" cy="27" r="2" fill="#180e0a" />
      <!-- 小手拿著金平糖 -->

    function getCountryInfo(feature) {
      const id = feature.id !== undefined && feature.id !== null
        ? String(feature.id).padStart(3, "0")
        : "";
      const name = feature.properties && feature.properties.name ? feature.properties.name : "";
      if (COUNTRY_DATA[id]) return COUNTRY_DATA[id];
      if (NAME_FALLBACK[name]) return NAME_FALLBACK[name];
      return { zh: name || "未知地區", arrivals: null };
    }

    function formatChineseApprox(num) {
      if (num >= 100000000) {
        return `約 ${(num / 100000000).toFixed(2)} 億人次`;
      }
      if (num >= 10000) {
        return `約 ${Math.round(num / 10000).toLocaleString("zh-TW")} 萬人次`;
      }
      return `精確推估數字`;

    const ttValue = document.getElementById("tooltip-value");
    const ttSub = document.getElementById("tooltip-sub");

    let projection, pathGenerator;

    const zoomBehavior = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => {
        viewport.attr("transform", event.transform);
        const k = event.transform.k;
        viewport.selectAll(".country").style("stroke-width", `${0.65 / Math.sqrt(k)}px`);
      });

    svg.call(zoomBehavior);

    function positionTooltip(clientX, clientY) {
      const pad = 16;
      const rect = tooltip.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      let left = clientX + 18;
      let top = clientY - rect.height / 2;

      if (left + rect.width + pad > vw) {
        left = clientX - rect.width - 18;
      }
      if (top + rect.height + pad > vh) {
        top = vh - rect.height - pad;
      }
      if (top < 78) {
        top = 78;
      }
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function renderMap() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const topPad = w < 720 ? 96 : 104;
      const bottomPad = w < 720 ? 48 : 34;
      const sidePad = w < 720 ? 16 : 48;

      projection = d3.geoNaturalEarth1()
        .fitExtent(
          [[sidePad, topPad], [w - sidePad, h - bottomPad]],
          { type: "FeatureCollection", features: currentCountries }
        );

      pathGenerator = d3.geoPath(projection);
      viewport.selectAll("*").remove();

      // 海洋球面
      viewport.append("path")
        .datum({ type: "Sphere" })
        .attr("class", "sphere-ocean")
        .attr("d", pathGenerator);

      // 經緯線
      viewport.append("path")
        .datum(d3.geoGraticule10())
        .attr("class", "graticule")
        .attr("d", pathGenerator);

      // 可愛動漫手繪雲朵裝飾（海域角落）
      const cloudGroup = viewport.append("g").attr("class", "cloud-decor");
      const cloudPositions = [
        { x: w * 0.14, y: h * 0.62, s: 0.9, cls: "cloud-drift-slow" },
        { x: w * 0.80, y: h * 0.25, s: 0.85, cls: "cloud-drift-slower" },
        { x: w * 0.45, y: h * 0.84, s: 0.75, cls: "cloud-drift-slow" }
      ];
      cloudPositions.forEach((c) => {
        const g = cloudGroup.append("g")
          .attr("transform", `translate(${c.x}, ${c.y}) scale(${c.s})`)
          .attr("class", c.cls);
        g.append("path")
          .attr("d", "M-36,10 C-44,10 -48,2 -42,-4 C-38,-9 -30,-7 -28,-4 C-25,-14 -10,-18 -1,-10 C5,-16 18,-13 21,-4 C29,-6 37,0 35,8 C34,13 28,15 22,15 L-28,15 C-33,15 -36,13 -36,10 Z")
          .attr("fill", "#fffaf2")
          .attr("stroke", "#cfa982")
          .attr("stroke-width", "1.4");
      });

      // 繪製各國
      viewport.append("g")
        .selectAll("path.country")
        .data(currentCountries)
        .join("path")
        .attr("class", "country")
        .attr("d", pathGenerator)
        .attr("fill", (d) => d._tier.color)
        .on("mouseenter", function (event, d) {
          d3.select(this).raise().classed("is-hovered", true);
          ttSwatch.style.background = d._tier.color;
          ttCountry.textContent = d._info.zh;

          if (d._info.arrivals !== null && d._info.arrivals !== undefined) {
            ttValue.textContent = `${d._info.arrivals.toLocaleString("zh-TW")} 位`;
            ttSub.textContent = `${formatChineseApprox(d._info.arrivals)}・${d._tier.label}`;
          } else {
            ttValue.textContent = "暫無統計資料";
            ttSub.textContent = "尚未納入 2026 年推估統計";
          }

          tooltip.classList.add("visible");
          positionTooltip(event.clientX, event.clientY);
        })
        .on("mousemove", function (event) {
          positionTooltip(event.clientX, event.clientY);
        })
        .on("mouseleave", function () {
          d3.select(this).classed("is-hovered", false);
          tooltip.classList.remove("visible");
          if (activeTierFilter) {
            d3.selectAll(".country").classed("dimmed", (d) => d._tier.id !== activeTierFilter);
          }
        });
    }

    // 縮放控制按鈕
    document.getElementById("zoom-in").addEventListener("click", () => {
      svg.transition().duration(320).call(zoomBehavior.scaleBy, 1.45);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      svg.transition().duration(320).call(zoomBehavior.scaleBy, 0.7);
    });

      svg.transition().duration(420).call(zoomBehavior.transform, d3.zoomIdentity);
    });

    // 載入 TopoJSON 世界地圖資料
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")

        const allCountries = topojson.feature(world, world.objects.countries).features;
        // 排除南極洲以讓各國版圖更清楚美觀
        currentCountries = allCountries
          .filter((f) => String(f.id).padStart(3, "0") !== "010" && f.properties?.name !== "Antarctica")
          .map((f) => {
            const info = getCountryInfo(f);
            f._info = info;
            f._tier = getTier(info.arrivals);
            return f;
          });

        renderMap();
        document.getElementById("loading-banner").classList.add("hidden");
      })
      .catch((err) => {
        console.error(err);
        document.getElementById("loading-banner").innerHTML =
          "<span style='color:#c84b31;'>無法載入世界地圖圖資，請確認網路連線後重新整理頁面。</span>";
      });

    // 視窗大小改變時重新適配地圖
    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (currentCountries.length) {
          svg.call(zoomBehavior.transform, d3.zoomIdentity);
          renderMap();
        }
      }, 180);
    });
  </script>
</body>
</html>
